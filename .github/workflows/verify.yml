name: verify

# The paper's checks and their break tests. The PDF is not rebuilt here; check_paper.py compares the committed PDF
# with the page count, SHA-256 and word count that the READMEs state. check_sources.py --online fetches every
# Crossref record again and compares it with the stored one.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python verification/check_paper.py
      - run: python verification/check_paper.py --break
      - run: python verification/check_sources.py --online
      - run: python verification/check_sources.py --break
      - run: python verification/check_text.py
      - run: python verification/check_text.py --break
      - run: python verification/check_copies.py
      - run: python verification/check_copies.py --break
      - run: node .github/checked-intake/verify.js --check
